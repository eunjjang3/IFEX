name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production dependency licenses
        run: npm run check:licenses

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check desktop entry points
        run: npm run check:desktop

      - name: Build production bundle
        run: npm run build

      - name: Verify build environment allowlist
        run: npm run check:build-env

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build and verify container
        run: ./scripts/verify-container.sh

  workflow-actions:
    name: Verify release workflow actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    timeout-minutes: 10
    steps:
      - name: Read Pages configuration without deploying
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Verify builder and prepare archive
        run: |
          docker buildx inspect --bootstrap
          printf 'IFEX artifact round trip\n' > expected.txt
          zip IFEX-smoke.zip expected.txt

      - name: Upload archive using release action
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: IFEX-smoke
          path: IFEX-smoke.zip
          if-no-files-found: error
          retention-days: 1

      - name: Download archive using release action
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: IFEX-smoke
          path: downloaded
          merge-multiple: true

      - name: Verify archive contents
        run: |
          cmp IFEX-smoke.zip downloaded/IFEX-smoke.zip
          unzip -p downloaded/IFEX-smoke.zip expected.txt | cmp expected.txt -
