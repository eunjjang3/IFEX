services:
  ifex:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "${IFEX_RESTART_POLICY:-unless-stopped}"
    ports:
      - "${IFEX_PORT:-80}:80"
    environment:
      IFEX_STRICT_FILE_TYPES: "${IFEX_STRICT_FILE_TYPES:-true}"
      IFEX_MAX_FILE_MIB: "${IFEX_MAX_FILE_MIB:-25}"
      IFEX_MAX_ACTIVE_FILES: "${IFEX_MAX_ACTIVE_FILES:-4}"
      IFEX_MAX_ACTIVE_MIB: "${IFEX_MAX_ACTIVE_MIB:-64}"
      IFEX_MAX_IMAGE_MEGAPIXELS: "${IFEX_MAX_IMAGE_MEGAPIXELS:-40}"
      IFEX_MAX_PREVIEW_DIMENSION: "${IFEX_MAX_PREVIEW_DIMENSION:-2048}"
      IFEX_STATISTICS_SAMPLE_DIMENSION: "${IFEX_STATISTICS_SAMPLE_DIMENSION:-400}"
      IFEX_MAX_EMBEDDED_THUMBNAIL_DIMENSION: "${IFEX_MAX_EMBEDDED_THUMBNAIL_DIMENSION:-1024}"
      IFEX_MAX_PIXEL_DIMENSION: "${IFEX_MAX_PIXEL_DIMENSION:-2048}"
      IFEX_MAX_SEARCH_COPY_DIMENSION: "${IFEX_MAX_SEARCH_COPY_DIMENSION:-1600}"
      IFEX_SEARCH_COPY_JPEG_QUALITY_PERCENT: "${IFEX_SEARCH_COPY_JPEG_QUALITY_PERCENT:-90}"
      IFEX_PARSE_CONCURRENCY: "${IFEX_PARSE_CONCURRENCY:-1}"
      IFEX_PARSE_TIMEOUT_MS: "${IFEX_PARSE_TIMEOUT_MS:-15000}"
      IFEX_PIXEL_TIMEOUT_MS: "${IFEX_PIXEL_TIMEOUT_MS:-20000}"
      IFEX_MAX_METADATA_TAGS: "${IFEX_MAX_METADATA_TAGS:-2000}"
      IFEX_MAX_METADATA_VALUE_CHARS: "${IFEX_MAX_METADATA_VALUE_CHARS:-16384}"
      IFEX_MAX_METADATA_TOTAL_CHARS: "${IFEX_MAX_METADATA_TOTAL_CHARS:-1048576}"
      IFEX_ALLOW_UNSAFE_PREVIEW: "${IFEX_ALLOW_UNSAFE_PREVIEW:-false}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
